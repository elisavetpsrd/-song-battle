<!doctype html><html lang="el"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Song Battle</title><style>body{font-family:system-ui;background:#111;color:white;text-align:center;margin:0;padding:30px}button,input,select{font-size:22px;padding:14px;margin:8px;border-radius:12px;border:0}.big{font-size:42px;padding:30px}.buzz{width:80vw;height:45vh;font-size:60px;background:#e33;color:white}.card{max-width:700px;margin:auto;padding:25px;background:#222;border-radius:22px}.score{font-size:52px}.winner{font-size:36px;color:#ffd54a}</style></head><body><div id="app" class="card"><h1>🎵 SONG BATTLE</h1><button onclick="host()">TV / HOST</button><button onclick="player()">ΚΙΝΗΤΟ / ΠΑΙΚΤΗΣ</button></div><script src="/socket.io/socket.io.js"></script><script>
const s=io();let room,team;const a=document.getElementById('app');
function host(){s.emit('create',c=>{room=c;a.innerHTML=`<h1>🎵 SONG BATTLE</h1><h2>ROOM <b>${c}</b></h2><p>Οι παίκτες ανοίγουν αυτή τη σελίδα και πατούν ΚΙΝΗΤΟ / ΠΑΙΚΤΗΣ</p><div class=score>TEAM A <span id=sa>0</span> — <span id=sb>0</span> TEAM B</div><div id=w class=winner>Περιμένουμε buzzer…</div><hr><h2>🎤 Host Controls</h2><button onclick="point('A')">+1 TEAM A</button><button onclick="point('B')">+1 TEAM B</button><button onclick="reset()">RESET BUZZER</button><br><input id=file type=file accept="audio/*"><audio id=aud controls style="width:100%"></audio><br><button onclick="play()">▶ PLAY</button><button onclick="stop()">⏸ STOP / ΣΥΝΕΧΙΣΕ ΣΤΙΧΟ</button>`;document.getElementById('file').onchange=e=>document.getElementById('aud').src=URL.createObjectURL(e.target.files[0]);});}
function player(){a.innerHTML=`<h2>Μπες στο παιχνίδι</h2><input id=r placeholder="ROOM CODE" inputmode=numeric><br><select id=t><option value=A>TEAM A</option><option value=B>TEAM B</option></select><br><button onclick="join()">JOIN</button>`}
function join(){room=document.getElementById('r').value;team=document.getElementById('t').value;s.emit('join',{room,team},ok=>{if(!ok)return alert('Δεν βρέθηκε room');a.innerHTML=`<h2>TEAM ${team}</h2><button class=buzz onclick="buzz()">BUZZ!</button><div id=status>Έτοιμοι!</div>`})}
function buzz(){s.emit('buzz')} function reset(){s.emit('reset')} function point(t){s.emit('point',t)}
function play(){document.getElementById('aud').play()}function stop(){document.getElementById('aud').pause()}
s.on('state',r=>{let sa=document.getElementById('sa'),sb=document.getElementById('sb'),w=document.getElementById('w');if(sa){sa.textContent=r.score.A;sb.textContent=r.score.B;w.textContent=r.buzz?`🔔 TEAM ${r.buzz} ΠΑΤΗΣΕ ΠΡΩΤΗ!`:'Περιμένουμε buzzer…'}let st=document.getElementById('status');if(st)st.textContent=r.buzz?(r.buzz===team?'ΠΡΟΛΑΒΕΣ!':'Σε πρόλαβαν!'):'Έτοιμοι!'});
</script></body></html>
